<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unofficial Qwacks Godot SDK — Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Pure GDScript SDK for the Qwacks game backend platform. Authentication, player data, analytics, shop, and more for Godot 4.x.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --theme-color: #478cbf;
      --sidebar-width: 280px;
      --sidebar-nav-link-color--active: #478cbf;
      --sidebar-nav-link-border-color--active: #478cbf;
      --cover-background-color: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --cover-heading-color: #fff;
      --cover-color: #ccc;
      --cover-button-primary-color: #478cbf;
      --cover-button-primary-color--hover: #3a7ab5;
      --code-background-color: #1e1e2e;
      --code-color: #cdd6f4;
    }
    .markdown-section code {
      border-radius: 4px;
      font-size: 0.9em;
    }
    .markdown-section pre > code {
      padding: 16px;
    }
    .tip {
      background-color: #f3f5f7;
      border-left: 4px solid #478cbf;
      padding: 12px 24px;
      margin: 16px 0;
    }
    .warning {
      background-color: #fff8e6;
      border-left: 4px solid #e6a817;
      padding: 12px 24px;
      margin: 16px 0;
    }
    .cover-main {
      max-width: 680px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<img src="https://img.shields.io/badge/SDK-v1.28.0-blue?logo=godot-engine" alt="Qwacks Godot SDK">',
      repo: '',
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3
      },
      auto2top: true,
      tabs: {
        persist: true,
        sync: true
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-gdscript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
