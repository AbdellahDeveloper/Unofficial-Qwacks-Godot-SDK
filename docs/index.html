<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unofficial Qwacks Godot SDK — Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Pure GDScript SDK for the Qwacks game backend platform. Authentication, player data, analytics, shop, and more for Godot 4.x.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    :root {
      --theme-color: #478cbf;
      --sidebar-width: 280px;
      --sidebar-nav-link-color--active: #478cbf;
      --sidebar-nav-link-border-color--active: #478cbf;
      --code-background-color: #0d1117;
      --code-color: #c9d1d9;
    }
    .markdown-section code {
      border-radius: 4px;
      font-size: 0.9em;
    }
    .markdown-section pre > code {
      padding: 16px;
    }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
    }
    .markdown-section th, .markdown-section td {
      border: 1px solid #333;
      padding: 8px 12px;
    }
    .markdown-section th {
      background-color: #161b22;
    }
    .markdown-section tr:nth-child(even) {
      background-color: #161b22;
    }
    .tip {
      background-color: #161b22;
      border-left: 4px solid #478cbf;
      padding: 12px 24px;
      margin: 16px 0;
    }
    .warning {
      background-color: #1c1a00;
      border-left: 4px solid #e6a817;
      padding: 12px 24px;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Qwacks Godot SDK',
      nameLink: '/',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3
      },
      auto2top: true
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-gdscript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
