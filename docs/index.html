<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unofficial Qwacks Godot SDK — Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Pure GDScript SDK for the Qwacks game backend platform. Authentication, player data, analytics, shop, and more for Godot 4.x.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    :root {
      --background: #0a0a0a;
      --background-color: #0a0a0a;
      --sidebar-background: #0f0f0f;
      --sidebar-width: 280px;
      --sidebar-border-color: #1a1a1a;
      --sidebar-nav-link-color: #888;
      --sidebar-nav-link-color--active: #478cbf;
      --sidebar-nav-link-border-color--active: #478cbf;
      --sidebar-nav-link-font-weight--active: bold;
      --sidebar-search-background-color: #161616;
      --sidebar-search-input-color: #ccc;
      --sidebar-search-input-background-color: #1a1a1a;
      --sidebar-search-input-border-color: #222;
      --sidebar-search-border-color: #222;
      --sidebar-search-highlight-color: #478cbf;
      --cover-background-color: #0a0a0a;
      --cover-heading-color: #fff;
      --cover-color: #aaa;
      --cover-button-primary-color: #478cbf;
      --cover-button-primary-color--hover: #3a7ab5;
      --cover-blockquote-color: #888;
      --text-color: #ccc;
      --heading-color: #fff;
      --heading-border-color: #1a1a1a;
      --link-color: #478cbf;
      --link-color--hover: #5da3d9;
      --code-background-color: #111;
      --code-color: #e0e0e0;
      --code-border-color: #1a1a1a;
      --markdown-section-color: #ccc;
      --markdown-table-border-color: #222;
      --markdown-table-stripe-background-color: #111;
      --blockquote-border-color: #478cbf;
      --blockquote-color: #888;
      --hr-border-color: #1a1a1a;
      --search-input-background-color: #161616;
      --search-input-color: #ccc;
      --search-result-background-color: #111;
      --search-result-highlight-color: #478cbf;
    }
    body {
      background: #0a0a0a;
      color: #ccc;
    }
    .markdown-section code {
      border-radius: 4px;
      font-size: 0.9em;
      background: #111;
      color: #e0e0e0;
    }
    .markdown-section pre > code {
      padding: 16px;
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
    }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
    }
    .markdown-section th, .markdown-section td {
      border: 1px solid #222;
      padding: 8px 12px;
    }
    .markdown-section th {
      background-color: #111;
      color: #fff;
    }
    .markdown-section tr:nth-child(even) {
      background-color: #0e0e0e;
    }
    .tip {
      background-color: #0d1a24;
      border-left: 4px solid #478cbf;
      padding: 12px 24px;
      margin: 16px 0;
    }
    .warning {
      background-color: #1a1600;
      border-left: 4px solid #e6a817;
      padding: 12px 24px;
      margin: 16px 0;
    }
    .sidebar {
      background: #0f0f0f;
      border-right: 1px solid #1a1a1a;
    }
    .sidebar-nav > ul > li > a {
      color: #888;
      border-color: #1a1a1a;
    }
    .sidebar-nav > ul > li > a:hover {
      color: #fff;
    }
    .sidebar-nav > ul > li.active > a {
      color: #478cbf;
      border-color: #478cbf;
      font-weight: bold;
    }
    .sidebar-nav li a {
      color: #888;
    }
    .sidebar-nav li a:hover {
      color: #ccc;
    }
    .sidebar-nav li.active > a {
      color: #478cbf;
    }
    .search .matching-post {
      background: #111;
      border: 1px solid #1a1a1a;
    }
    .search .matching-post a {
      color: #478cbf;
    }
    .app-nav {
      background: #0f0f0f;
    }
    a {
      color: #478cbf;
    }
    a:hover {
      color: #5da3d9;
    }
    .sidebar-toggle {
      top: 14px;
      bottom: auto;
    }
    input, textarea {
      background: #111 !important;
      color: #ccc !important;
      border-color: #222 !important;
    }
    input:focus, textarea:focus {
      border-color: #478cbf !important;
      outline: none;
    }
    button, .copy-to-clipboard-button {
      background: #1a1a1a !important;
      border-color: #333 !important;
      color: #aaa !important;
    }
    button:hover, .copy-to-clipboard-button:hover {
      background: #222 !important;
      color: #fff !important;
    }
    .copy-to-clipboard-button {
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75em;
    }
    .markdown-section pre > button {
      background: #1a1a1a !important;
      border: 1px solid #333 !important;
      color: #aaa !important;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8em;
    }
    .markdown-section pre > button:hover {
      background: #222 !important;
      color: #fff !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Qwacks Godot SDK',
      nameLink: '/',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3
      },
      auto2top: true
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-gdscript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
